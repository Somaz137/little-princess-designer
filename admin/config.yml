backend:
  name: git-gateway
  branch: main

media_folder: "uploads/products"
public_folder: "/uploads/products"

collections:
  - name: "products"
    label: "Products"
    files:
      - file: "products.json"
        label: "Product Catalog"
        name: "catalog"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Price (USD)", name: "price", widget: "number", value_type: "float" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["girls", "boys", "baby"]
              - label: "Sizes"
                name: "sizes"
                widget: "select"
                multiple: true
                options: ["0-3M","3-6M","6-12M","12-18M","2T","3T","4T","5","6","7","8"]
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Photo", name: "image", widget: "image", required: false }
